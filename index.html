    <title>貝貝之旅 | 我們的歷程</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .Endorsement {
            position: absolute;
            z-index: 1500;
        }
            .Endorsement img {
                width: 100%;
            }
        #before {
            width: 300px;
            margin-top: 200px;
            margin-left: 50px;
            animation-name: logo-animation;
            animation-duration: 2s;
            animation-iteration-count: infinite;
        }
        #after {
            width: 300px;
            margin-top: 350px;
            margin-left: 50px;
            height: 300px;
            animation-name: logo-animation;
            animation-duration: 2s;
            animation-iteration-count: infinite;
        }
        #stick {
            width: 80px;
            margin-top: 400px;
            margin-left: 80px;
            transform: translate(70px,60px) rotate(3deg);
            transition: 1.5s;
            transition-duration: 2;
            transition-timing-function: ease-in-out;

        }

            #stick:active {
                transform: translate(85px,-30px) rotate(3deg);
            }
        @keyframes logo-animation {
            0% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(5deg);
            }

            50% {
                transform: rotate(-5deg);
            }

            75% {
                transform: rotate(5deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }
    </style>
</head>
<body>
    <div id="after" class="Endorsement"><img src="111.jpg"></div>
    <div id="before" class="Endorsement"><img src="112.jpg.png"></div>
    <div id="stick" class="Endorsement"><img src="113.jpg"></div>
