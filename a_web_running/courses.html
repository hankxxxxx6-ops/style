    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <script src="js/jquery-3.7.1.min.js"></script>
    <script>
    var index = 0;
    var img = ["777.jpg", "888.jpg", "999.jpg"];
    var title = ["審判者", "歸宿", "川太郎"];
    var info = ["命運由你決定", "若能從頭來過，你是否願意接受這份沉甸甸的羈絆", "日本鬼怪傳說-河童"];
    var timer; // 用來存放計時器

function toHTML(index) {
    // 使用一個 div 包裹所有內容，並設定文字置中
    var hm = "<div style='text-align: center;'>"; 
    
    // 圖片設定 display: block 搭配 margin: auto 即可水平置中
    hm += "<img src='images/" + img[index] + "' width='180' style='display: block; margin: 10px auto;'>";
    
    // 標題與文字因為在外層 div 已設定 text-align: center，會自動置中
    hm += "<h3>" + title[index] + "</h3>";
    hm += "<p>" + info[index] + "</p>";
    
    hm += "</div>";
    return hm;
}

    // 更新圓點狀態
    function updateDots(index) {
        $(".dot").css("color", "#ccc"); // 全部變灰色
        $(".dot").eq(index).css("color", "white"); // 當前變白色
    }

    function fnNext() {
        index++;
        if (index >= img.length) index = 0;
        $("#div_cont").hide().html(toHTML(index)).fadeIn(1000);
        updateDots(index);
    }

    $(document).ready(function () {
        $("#div_cont").html(toHTML(index));
        updateDots(index);

        // 啟動自動播放
        startTimer();

        // 滑鼠移入停止，移出繼續
        $("#div_cont").hover(
            function() { clearInterval(timer); }, // 移入
            function() { startTimer(); }          // 移出
        );
    });

    function startTimer() {
        timer = setInterval(fnNext, 4000);
    }
</script>
<style>
    /* 設定圖片的基本轉場效果 */
    #div_cont img {
        transition: transform 0.5s ease; /* 讓放大過程平滑，0.5秒完成 */
    }

    /* 滑鼠移上去時放大 1.1 倍 */
    #div_cont img:hover {
        transform: scale(2.5); 
        cursor: pointer;
    }

     .btn {
        display: inline-block;
        transition: transform 0.3s ease;
        text-decoration: none;
    }

    .btn:hover {
        transform: scale(1.2);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
</style>
</head>
