    <style>
        /* 跑馬燈外框：滿版寬度並隱藏超出部分 */
.marquee-container {
    width: 100%;
    overflow: hidden; 
    background: rgba(255, 255, 255, 0.459); /* 稍微透出底色 */
    padding: 50px 0;
    margin-top: 50px;
    border-top: 2px solid rgba(255, 255, 255, 0.2);
}

/* 跑馬燈內容：使用 Flex 橫向排列 */
.marquee-content {
    display: flex;
    animation: scroll-left 20s linear infinite; /* 建議調慢一點(25s)看起來比較舒服 */
    width: max-content; /* 核心修正：強制寬度等於所有圖片總寬 */
}

.marquee-content img {
    /* 核心修正：取消固定寬度，改用高度統一，寬度自適應 */
    height: 280px;      /* 統一所有圖片高度 */
    width: auto;        /* 寬度根據圖片比例自動調整，不變形 */
    
    /* 核心修正：不裁剪圖片，完整顯示 */
    object-fit: contain; 
    
    flex-shrink: 0;     /* 防止圖片被壓縮 */
    margin: 0 20px;     /* 增加間距 */
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: transform 0.3s;
}


/* 滑鼠移入圖片時放大 */
.marquee-content img:hover {
    transform: scale(1.3);
    z-index: 10; /* 確保放大的圖片不會被後面的圖片蓋住 */
    position: relative; /* 配合 z-index 使用 */
}

/* 滑鼠移入容器時動畫暫停 */
.marquee-container:hover .marquee-content {
    animation-play-state: paused;
}

/* 跑馬燈核心動畫：從 0 移到負的一半長度 */
@keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); } 
}
